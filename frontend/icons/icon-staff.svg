<!-- The staff app's icon: the same mark on slate rather than sky, so the two
     installed apps can be told apart on a home screen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="aniprotech staff">
  <defs>
    <linearGradient id="aps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#aps)"/>
  <g transform="translate(96 96) scale(5)" fill="none" stroke="#ffffff"
     stroke-width="5" stroke-linecap="round">
    <circle cx="32" cy="32" r="25.5" stroke-dasharray="134 26.2"
            transform="rotate(68 32 32)"/>
    <circle cx="28.5" cy="33" r="9"/>
    <path d="M37.5 24.5 V 40"/>
    <circle cx="47" cy="47" r="2.6" fill="#ffffff" stroke="none"/>
  </g>
</svg>
