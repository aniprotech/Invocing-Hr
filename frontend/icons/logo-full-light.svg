<!-- The full lockup for a dark page.

     Same drawing as logo-full.svg, with the wordmark and the strapline set in
     white instead of ink.

     Two files rather than one, because an SVG referenced through <img> is its
     own document: currentColor inside it resolves against the SVG's own root
     and never against the page, so `style="color:#fff"` on the <img> tag does
     nothing at all and the wordmark comes out black. The alternative is to
     paste the markup inline on every dark page, which is the same drawing
     copied six times and no longer cached.

     Keep the two in step: a change to one belongs in the other. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" role="img"
     aria-label="aniprotech - HR, payroll, invoice, people">
  <defs>
    <linearGradient id="apMarkLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- the mark -->
  <g transform="translate(2 6) scale(1.05)" fill="none" stroke="url(#apMarkLight)"
     stroke-width="5" stroke-linecap="round">
    <circle cx="32" cy="32" r="25.5" stroke-dasharray="134 26.2"
            transform="rotate(68 32 32)"/>
    <circle cx="28.5" cy="33" r="9"/>
    <path d="M37.5 24.5 V 40"/>
    <circle cx="47" cy="47" r="2.6" fill="url(#apMarkLight)" stroke="none"/>
  </g>

  <!-- the wordmark -->
  <text x="82" y="46" font-family="Poppins, system-ui, -apple-system, Arial, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#f8fafc">anipro</tspan><tspan fill="#38bdf8">tech</tspan>
  </text>

  <!-- the line under it -->
  <text x="83" y="66" font-family="Poppins, system-ui, -apple-system, Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="2.6"
        fill="#94a3b8">HR • PAYROLL • INVOICE • PEOPLE</text>
</svg>
