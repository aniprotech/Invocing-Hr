<!-- The aniprotech mark: an open ring with the bowl and stem of a lowercase
     "a" inside it, and the dot sitting in the ring's gap.

     Drawn with currentColor rather than a fixed fill, so the header picks it
     up from the theme - which the operator can now change - instead of
     needing a second file per colour. The coloured version for app icons and
     the favicon is icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
     stroke="currentColor" stroke-width="5" stroke-linecap="round" role="img"
     aria-label="aniprotech">
  <!-- The ring, left open at the lower right. Dashed rather than an arc path
       so the gap can be adjusted by one number. -->
  <circle cx="32" cy="32" r="25.5" stroke-dasharray="134 26.2"
          transform="rotate(68 32 32)"/>
  <!-- the bowl -->
  <circle cx="28.5" cy="33" r="9"/>
  <!-- the stem -->
  <path d="M37.5 24.5 V 40"/>
  <!-- the dot, in the gap -->
  <circle cx="47" cy="47" r="2.6" fill="currentColor" stroke="none"/>
</svg>
