<!-- The full lockup: the mark, the wordmark, and the line under it.

     For the places that introduce the product rather than just label a
     screen - the sign-in page, the landing hero. Inside the app the header
     is already the product, so it uses the mark alone (logo-mark.svg).

     The wordmark is drawn rather than set in a font, so it looks the same
     everywhere and needs no webfont to have loaded first. Two tones, as on
     the brand sheet: "ani" and "pro" solid, "tech" in the accent.

     This is the version for a light page. Its colours are literal rather than
     currentColor: referenced through <img> the file is its own document, so
     currentColor would resolve to black here whatever the page sets. The dark
     counterpart is logo-full-light.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" role="img"
     aria-label="aniprotech - HR, payroll, invoice, people">
  <defs>
    <linearGradient id="apMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- the mark -->
  <g transform="translate(2 6) scale(1.05)" fill="none" stroke="url(#apMark)"
     stroke-width="5" stroke-linecap="round">
    <circle cx="32" cy="32" r="25.5" stroke-dasharray="134 26.2"
            transform="rotate(68 32 32)"/>
    <circle cx="28.5" cy="33" r="9"/>
    <path d="M37.5 24.5 V 40"/>
    <circle cx="47" cy="47" r="2.6" fill="url(#apMark)" stroke="none"/>
  </g>

  <!-- the wordmark -->
  <text x="82" y="46" font-family="Poppins, system-ui, -apple-system, Arial, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#0f172a">anipro</tspan><tspan fill="#38bdf8">tech</tspan>
  </text>

  <!-- the line under it -->
  <text x="83" y="66" font-family="Poppins, system-ui, -apple-system, Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="2.6"
        fill="#64748b">HR • PAYROLL • INVOICE • PEOPLE</text>
</svg>
