<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>aniprotech - Reset password</title>
  <link rel="stylesheet" href="tailwind.css?v=124">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #082f49 50%, #0f172a 100%); }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.3); border-color: #0ea5e9; }
  </style>
  <link rel="stylesheet" href="mobile.css?v=124">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=124">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=124">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=124">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=124">
    <script src="/dialogs.js?v=1"></script>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/icons/logo-full-light.svg?v=124" alt="aniprotech"
           width="212" height="56" class="mx-auto">
      <h1 class="text-xl font-semibold text-white/90 mt-4">Choose a new password</h1>
    </div>

    <div class="glass rounded-2xl p-8">
      <!-- While the link is being checked, so nobody types a password into a dead form -->
      <div id="checking" class="text-center text-white/60 text-sm py-6">Checking your link...</div>

      <div id="deadLink" class="hidden text-center py-4">
        <div class="mb-3 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm">
          That reset link is invalid or has expired.
        </div>
        <p class="text-white/50 text-sm mb-4">Links work once and last an hour.</p>
        <a id="askAgain" href="/employee-login.html"
           class="inline-block py-2.5 px-5 bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold rounded-xl transition-colors">
          Back to sign in
        </a>
      </div>

      <form id="resetForm" class="hidden" autocomplete="off">
        <div class="mb-4">
          <label class="block text-sm text-white/70 mb-2">New password</label>
          <input type="password" id="password" required autocomplete="new-password"
                 class="input-glow w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 outline-none transition-all"
                 placeholder="At least 8 characters">
        </div>
        <div class="mb-4">
          <label class="block text-sm text-white/70 mb-2">Confirm password</label>
          <input type="password" id="confirm" required autocomplete="new-password"
                 class="input-glow w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 outline-none transition-all"
                 placeholder="Type it again">
        </div>
        <p class="text-xs text-white/40 mb-4">
          Needs at least 8 characters, one capital letter and one number.
        </p>
        <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm text-center"></div>
        <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold rounded-xl transition-all">
          Set new password
        </button>
      </form>

      <div id="done" class="hidden text-center py-4">
        <div class="mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-sm">
          Password updated.
        </div>
        <a id="goSignIn" href="/employee-login.html"
           class="inline-block py-2.5 px-5 bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold rounded-xl transition-colors">
          Sign in
        </a>
      </div>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-sm text-white/30 hover:text-white/60 transition-colors">Back to aniprotech</a>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var token = params.get('token') || '';
    // Send people back to whichever door they came in by.
    var signInUrl = params.get('portal') === 'employee' ? '/employee-login.html' : '/login.html';
    document.getElementById('goSignIn').href = signInUrl;
    document.getElementById('askAgain').href = signInUrl;

    function show(id) {
      ['checking', 'deadLink', 'resetForm', 'done'].forEach(function (x) {
        document.getElementById(x).classList.toggle('hidden', x !== id);
      });
    }

    function fail(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // Check before showing the form, so a dead link is not discovered only
    // after someone has chosen and typed a new password twice.
    (async function () {
      if (!token) { show('deadLink'); return; }
      try {
        var res = await fetch('/api/client/reset-password?token=' + encodeURIComponent(token));
        var data = await res.json();
        show(data.valid ? 'resetForm' : 'deadLink');
      } catch (e) {
        show('deadLink');
      }
    })();

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      document.getElementById('errorMsg').classList.add('hidden');
      var password = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;
      if (password !== confirm) { fail('Those two do not match.'); return; }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      try {
        var res = await fetch('/api/client/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: password })
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { fail(data.detail || 'Could not set that password.'); btn.disabled = false; return; }
        show('done');
      } catch (err) {
        fail('Something went wrong. Try again.');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
