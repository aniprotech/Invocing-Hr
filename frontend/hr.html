<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>aniprotech</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=129">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=129">
    <!-- Invoicing and HR were two pages with two logins, so the same account
         saw a different product depending on which URL it opened, and anybody
         with both signed in twice. They are one app now and what appears in it
         comes from the plan.

         This stays as a redirect rather than being deleted: it is bookmarked,
         it is in old emails, and 404 is a worse answer than arriving. The hash
         is carried across so a link to a particular screen still lands there. -->
    <script>
        var hash = window.location.hash || '';
        // #/hr was this page's own dashboard; it still exists in the merged app.
        window.location.replace('/app.html' + (hash || '#/hr'));
    </script>
    <meta http-equiv="refresh" content="0; url=/app.html#/hr">
    <script src="/dialogs.js?v=1"></script>
</head>
<body>
    <p style="font-family:system-ui,sans-serif;padding:24px;">
        The HR portal is part of the main app now.
        <a href="/app.html#/hr">Continue</a>.
    </p>
</body>
</html>
