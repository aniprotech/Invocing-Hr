<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>aniprotech - Employee Login</title>
  <link rel="stylesheet" href="tailwind.css?v=127">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #082f49 50%, #0f172a 100%); }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow { box-shadow: 0 0 60px rgba(14, 165, 233, 0.3), 0 0 120px rgba(14, 165, 233, 0.1); }
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.3); border-color: #0ea5e9; }
    .float-particle { position: absolute; border-radius: 50%; background: rgba(14, 165, 233, 0.15); animation: float 20s infinite ease-in-out; }
    @keyframes float { 0%,100% { transform: translateY(0) translateX(0); } 25% { transform: translateY(-30px) translateX(20px); } 50% { transform: translateY(-10px) translateX(-15px); } 75% { transform: translateY(-40px) translateX(10px); } }
    .shimmer { background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent); animation: shimmer 2s infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  </style>
    <link rel="stylesheet" href="mobile.css?v=127">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=127">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=127">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=127">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=127">
    <script src="/dialogs.js?v=1"></script>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <div class="float-particle w-72 h-72 -top-20 -left-20" style="animation-delay:0s;"></div>
  <div class="float-particle w-96 h-96 -bottom-32 -right-32" style="animation-delay:5s;"></div>
  <div class="float-particle w-48 h-48 top-1/3 right-1/4" style="animation-delay:10s;"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8">
      <!-- The full lockup. This page introduces the product to somebody
           who may only ever see this one screen of it. -->
      <img src="/icons/logo-full-light.svg?v=127" alt="aniprotech"
           width="212" height="56" class="mx-auto mb-4">
      <h1 class="text-xl font-semibold text-white/90">Employee Portal</h1>
      <p class="text-sm text-white/40 mt-1">Sign in to access your dashboard</p>
    </div>

    <div class="glass rounded-2xl p-8 glow">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-sm font-medium text-white/70 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-white/30" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 focus:outline-none input-glow transition-all" placeholder="you@company.com" required autofocus>
          </div>
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-white/70 mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-white/30" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <input type="password" id="password" class="w-full pl-10 pr-12 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 focus:outline-none input-glow transition-all" placeholder="Enter your password" required>
            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-white/30 hover:text-white/60 transition-colors" onclick="togglePassword()">
              <svg id="eyeOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg id="eyeClosed" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>
        <div id="locationStatus" class="flex items-center gap-2 text-xs text-white/40 mb-4">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span>Detecting location...</span>
        </div>
        <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm text-center"></div>
        <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-brand-500/25" id="loginBtn">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="hidden"><svg class="animate-spin h-5 w-5 mx-auto text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg></span>
        </button>
      </form>

      <!-- Google needs no password and no invitation: HR putting the address on
           the employee record is the whole enrolment. -->
      <div class="flex items-center gap-3 my-5">
        <span class="h-px flex-1 bg-white/10"></span>
        <span class="text-xs text-white/40">or</span>
        <span class="h-px flex-1 bg-white/10"></span>
      </div>

      <a href="/api/auth/login?portal=employee"
         class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-white text-slate-800 font-semibold hover:bg-white/90 transition-colors">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </a>
      <p class="text-xs text-white/40 text-center mt-3">
        Use the address your employer has on file for you.
      </p>

      <!-- Staff sign in with a password here, so this is where lockouts happen. -->
      <div class="text-center mt-5">
        <button type="button" id="forgotLink" class="text-sm text-white/40 hover:text-white/70 transition-colors">
          Forgot your password?
        </button>
      </div>

      <div id="forgotBox" class="hidden mt-4 pt-4 border-t border-white/10">
        <label class="block text-sm text-white/70 mb-2">Your work email</label>
        <input type="email" id="forgotEmail" autocomplete="email"
               class="input-glow w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 outline-none transition-all"
               placeholder="you@company.com">
        <button type="button" id="forgotSend"
                class="w-full mt-3 py-2.5 px-4 bg-white/10 hover:bg-white/15 text-white text-sm font-semibold rounded-xl transition-colors">
          Email me a reset link
        </button>
        <p id="forgotMsg" class="hidden mt-3 text-sm text-center text-white/60"></p>
      </div>
    </div>

    <div class="text-center mt-6">
      <a href="/" class="text-sm text-white/30 hover:text-white/60 transition-colors inline-flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to aniprotech
      </a>
    </div>
  </div>

  <script>
    var userLocation = { lat: 0, lng: 0, label: '' };

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          userLocation.lat = pos.coords.latitude;
          userLocation.lng = pos.coords.longitude;
          document.getElementById('locationStatus').innerHTML = '<svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg><span class="text-emerald-400/80">Location detected</span>';
          fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + userLocation.lat + '&lon=' + userLocation.lng, { credentials: 'omit' })
            .then(function(r) { return r.json(); }).then(function(d) { userLocation.label = d.display_name || ''; }).catch(function() {});
        },
        function() {
          document.getElementById('locationStatus').innerHTML = '<svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg><span class="text-amber-400/80">Location access denied. You can still sign in.</span>';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      document.getElementById('locationStatus').innerHTML = '<svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg><span class="text-amber-400/80">Geolocation not supported</span>';
    }

    function togglePassword() {
      var inp = document.getElementById('password');
      var o = document.getElementById('eyeOpen');
      var c = document.getElementById('eyeClosed');
      if (inp.type === 'password') { inp.type = 'text'; o.classList.add('hidden'); c.classList.remove('hidden'); }
      else { inp.type = 'password'; o.classList.remove('hidden'); c.classList.add('hidden'); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      var txt = document.getElementById('btnText');
      var spinner = document.getElementById('btnSpinner');
      var err = document.getElementById('errorMsg');
      btn.disabled = true; txt.classList.add('hidden'); spinner.classList.remove('hidden'); err.classList.add('hidden');
      try {
        var res = await fetch('/api/employee/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            latitude: userLocation.lat, longitude: userLocation.lng,
            location_label: userLocation.label, device_info: navigator.userAgent,
          }),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        window.location.href = '/employee-dashboard.html';
      } catch (e) {
        err.textContent = e.message; err.classList.remove('hidden');
      } finally {
        btn.disabled = false; txt.classList.remove('hidden'); spinner.classList.add('hidden');
      }
    }

    // --- forgotten password -------------------------------------------------
    document.getElementById('forgotLink').addEventListener('click', function () {
      var box = document.getElementById('forgotBox');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) {
        var email = document.getElementById('email');
        document.getElementById('forgotEmail').value = email ? email.value : '';
        document.getElementById('forgotEmail').focus();
      }
    });

    document.getElementById('forgotSend').addEventListener('click', async function () {
      var btn = this;
      var msg = document.getElementById('forgotMsg');
      var address = document.getElementById('forgotEmail').value.trim();
      if (!address) { msg.textContent = 'Enter your work email first.'; msg.classList.remove('hidden'); return; }
      btn.disabled = true;
      try {
        var res = await fetch('/api/employee/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: address })
        });
        var data = await res.json().catch(function () { return {}; });
        // The server answers the same either way, so this never reveals
        // whether the address has an account.
        msg.textContent = res.ok
          ? (data.message || 'If that email has an account, a reset link is on its way.')
          : (data.detail || 'Try again in a moment.');
      } catch (e) {
        msg.textContent = 'Something went wrong. Try again.';
      }
      msg.classList.remove('hidden');
      btn.disabled = false;
    });
  </script>
</body>
</html>
