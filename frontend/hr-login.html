<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in - Ani Protech</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=103">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=103">
    <!-- One sign-in for the business now. There is no separate HR account to
         hold: the same login reaches whatever the plan includes, so a second
         door here would only be a second place to get the password wrong.

         Kept as a redirect because it is bookmarked, and the next= is carried
         so somebody sent here on their way to a page still gets there. -->
    <script>
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next') || '';
        // Only a path on this site, never an address somebody supplied.
        var safe = (next.charAt(0) === '/' && next.charAt(1) !== '/') ? next : '/app.html#/hr';
        window.location.replace('/login.html?next=' + encodeURIComponent(safe));
    </script>
    <meta http-equiv="refresh" content="0; url=/login.html">
</head>
<body>
    <p style="font-family:system-ui,sans-serif;padding:24px;">
        There is one sign-in for the whole app now.
        <a href="/login.html">Continue</a>.
    </p>
</body>
</html>
