name: Tests

# The suite only ever ran when someone remembered to run it. This makes a
# broken main branch visible before it reaches Railway.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile, so CI is testing what production runs.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Test-only, deliberately not in the runtime requirements.
          pip install pytest

      - name: Run the suite
        working-directory: backend
        env:
          # Tests build their own SQLite schema; never point CI at real data.
          DATABASE_URL: sqlite:///./ci-test.db
          SECRET_KEY: ci-secret-key-not-used-anywhere-else
        run: python -m pytest -q

  # The PDF generator only fails at runtime, and when it throws it takes the
  # invoice preview and the emailed attachment down together - both call it.
  # Nothing in the Python suite touches it.
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate a PDF for every theme
        run: npm test
